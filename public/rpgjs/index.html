<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>智慧园区 · 判断选择用分支</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>*{box-sizing:border-box}html,body,#rpg{width:100%;height:100%;margin:0;overflow:hidden}body{background:#173b31;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}#rpg{position:relative}#rpg canvas{display:block}#vue-gui-overlay{pointer-events:none;z-index:100;position:absolute;inset:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline-offset:3px;outline:3px solid #ffc968}[hidden]{display:none!important}#engine-controls{pointer-events:none;z-index:50;position:absolute;inset:0}#engine-controls button{pointer-events:auto;color:#193d32;touch-action:none;-webkit-user-select:none;user-select:none;background:#fff9ecf2;border:2px solid #dce8ce;border-radius:12px;min-height:46px;font-weight:750;box-shadow:0 3px #173b3160}.engine-tools{top:max(12px, env(safe-area-inset-top));right:max(12px, env(safe-area-inset-right));gap:8px;display:flex;position:absolute}.engine-tools button{padding:8px 14px;font-size:13px}.engine-pad{bottom:max(16px, env(safe-area-inset-bottom));left:max(16px, env(safe-area-inset-left));grid-template-rows:repeat(3,46px);grid-template-columns:repeat(3,50px);gap:5px;display:grid;position:absolute}.engine-pad button{padding:0;font-size:24px}.engine-pad button[aria-pressed=true]{box-shadow:none;background:#d0e7c7;transform:translateY(2px)}.engine-pad [data-direction=up]{grid-area:1/2}.engine-pad [data-direction=left]{grid-area:2/1}.engine-pad [data-direction=right]{grid-area:2/3}.engine-pad [data-direction=down]{grid-area:3/2}#engine-controls #engine-action{bottom:max(24px, env(safe-area-inset-bottom));right:max(20px, env(safe-area-inset-right));color:#fff;background:#1c624d;width:86px;height:70px;font-size:19px;position:absolute}#engine-action small{margin-top:4px;font-size:10px;font-weight:500;display:block}.engine-pad-caption{color:#fff;text-shadow:0 1px 3px #0e302d;white-space:nowrap;font-size:11px;position:absolute;bottom:0;left:175px}#engine-status{color:#19392d;text-align:center;z-index:1200;background:#fff9e9;border:3px solid #d6bd79;border-radius:18px;padding:22px;position:absolute;inset:22% 8% auto;box-shadow:0 15px 45px #092b2a66}#engine-status p{margin:0 0 15px;line-height:1.7}#engine-status button{color:#fff;background:#1c624d;border:0;border-radius:9px;min-height:44px;padding:8px 20px}@media (width<=600px){.engine-pad{grid-template-rows:repeat(3,44px);grid-template-columns:repeat(3,46px);gap:3px;bottom:10px;left:10px}.engine-pad-caption{display:none}.engine-tools{gap:5px;top:8px;right:8px}.engine-tools button{padding:6px 10px;font-size:12px}#engine-controls #engine-action{width:72px;height:62px;font-size:17px;bottom:20px;right:12px}}</style>
    <script type="module" crossorigin src="/rpgjs/assets/index-DyGnMt-s.js"></script>
    <link rel="modulepreload" crossorigin href="/rpgjs/assets/rolldown-runtime-XKyaHtl9.js">
    <link rel="modulepreload" crossorigin href="/rpgjs/assets/canvasengine-DjHPjr3v.js">
    <link rel="modulepreload" crossorigin href="/rpgjs/assets/pixi-CELqzPx0.js">
    <link rel="stylesheet" crossorigin href="/rpgjs/assets/index-D3xUtpxt.css">
  </head>
  <body>
    <div id="rpg"><div id="vue-gui-overlay"></div></div>
    <div id="engine-controls" aria-label="园区操作" hidden>
      <nav class="engine-tools" aria-label="探究帮助">
        <button id="engine-flow" type="button">查看流程</button>
        <button id="engine-help" type="button">操作帮助</button>
      </nav>
      <div class="engine-pad" aria-label="按住方向按钮行走">
        <button type="button" data-direction="up" aria-label="向上行走" aria-pressed="false">↑</button>
        <button type="button" data-direction="left" aria-label="向左行走" aria-pressed="false">←</button>
        <button type="button" data-direction="right" aria-label="向右行走" aria-pressed="false">→</button>
        <button type="button" data-direction="down" aria-label="向下行走" aria-pressed="false">↓</button>
        <span class="engine-pad-caption">按住行走 · 面向人物或设备后交互</span>
      </div>
      <button id="engine-action" type="button">交互<small>E / 空格</small></button>
    </div>
    <aside id="engine-status" role="alert" hidden>
      <p id="engine-status-text"></p>
      <button id="engine-reload" type="button" hidden>重新加载园区</button>
      <button id="engine-dismiss" type="button">返回现场</button>
    </aside>
  </body>
</html>
