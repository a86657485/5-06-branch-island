    <style>*{box-sizing:border-box}html,body,#rpg{width:100%;height:100%;margin:0;overflow:hidden}body{background:#173b31;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}#rpg{position:relative}#rpg canvas{display:block}#vue-gui-overlay{pointer-events:none;z-index:100;position:absolute;inset:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline-offset:3px;outline:3px solid #ffc968}[hidden]{display:none!important}#engine-controls{pointer-events:none;z-index:50;position:absolute;inset:0}#engine-controls button{pointer-events:auto;color:#193d32;touch-action:none;-webkit-user-select:none;user-select:none;background:#fff9ecf2;border:2px solid #dce8ce;border-radius:12px;min-height:46px;font-weight:750;box-shadow:0 3px #173b3160}.engine-tools{top:max(12px, env(safe-area-inset-top));right:max(12px, env(safe-area-inset-right));gap:8px;display:flex;position:absolute}.engine-tools button{padding:8px 14px;font-size:13px}.engine-pad{bottom:max(16px, env(safe-area-inset-bottom));left:max(16px, env(safe-area-inset-left));grid-template-rows:repeat(3,46px);grid-template-columns:repeat(3,50px);gap:5px;display:grid;position:absolute}.engine-pad button{padding:0;font-size:24px}.engine-pad button[aria-pressed=true]{box-shadow:none;background:#d0e7c7;transform:translateY(2px)}.engine-pad [data-direction=up]{grid-area:1/2}.engine-pad [data-direction=left]{grid-area:2/1}.engine-pad [data-direction=right]{grid-area:2/3}.engine-pad [data-direction=down]{grid-area:3/2}#engine-controls #engine-action{bottom:max(24px, env(safe-area-inset-bottom));right:max(20px, env(safe-area-inset-right));color:#fff;background:#1c624d;width:86px;height:70px;font-size:19px;position:absolute}#engine-action small{margin-top:4px;font-size:10px;font-weight:500;display:block}.engine-pad-caption{color:#fff;text-shadow:0 1px 3px #0e302d;white-space:nowrap;font-size:11px;position:absolute;bottom:0;left:175px}#engine-task-hint{color:#1b4434;z-index:80;pointer-events:none;background:#fffaf0ef;border:2px solid #93ad7e;border-radius:12px;max-width:min(580px,100% - 215px);margin:0;padding:10px 14px;font-size:16px;line-height:1.5;position:absolute;top:10px;left:14px}#focus-marker{z-index:80;pointer-events:none;color:#173b31;flex-direction:column;align-items:center;gap:0;font-weight:800;display:flex;position:absolute;top:0;left:0;transform:translate(-50%,-108%)}#focus-marker .focus-ring{background:#ffcf5a66;border:5px solid #e39b00;border-radius:50%;width:54px;height:22px;animation:1.1s ease-in-out infinite focus-pulse;box-shadow:0 0 0 6px #147d78aa}#focus-marker .focus-arrow{color:#e39b00;filter:drop-shadow(0 2px #173b31);font-size:34px;line-height:1;animation:1s ease-in-out infinite focus-bounce}#focus-marker.edge{transform:translate(-50%,-50%)}#focus-marker.edge .focus-ring{display:none}#focus-marker.edge .focus-arrow{font-size:42px}#path-dots{z-index:70;pointer-events:none;position:fixed;inset:0}.path-dot{background:#e39b00;border:3px solid #173b31;border-radius:50%;width:16px;height:16px;margin:-8px 0 0 -8px;position:absolute;box-shadow:0 0 0 3px #fff6}#engine-task-hint[data-strength="1"],#engine-task-hint[data-strength="2"],#engine-goto.focus-target{outline:4px solid #ffcf5a;animation:1s ease-in-out infinite focus-pulse}.card-tray.focus-target,.flow-slot.focus-target,.studio.focus-target{outline-offset:4px;outline:4px solid #e39b00}.predict-option.focus-target,.predict-row.next button{outline-offset:2px;outline:3px solid #1175bb}@keyframes focus-pulse{50%{border-color:#fff;outline-color:#147d78}}@keyframes focus-bounce{50%{transform:translateY(-6px)}}@media (width<=600px){#engine-task-hint{max-width:calc(100% - 20px);padding:7px 10px;font-size:14px;top:62px;left:10px}}#engine-status{color:#19392d;text-align:center;z-index:1200;background:#fff9e9;border:3px solid #d6bd79;border-radius:18px;padding:22px;position:absolute;inset:22% 8% auto;box-shadow:0 15px 45px #092b2a66}#engine-status p{margin:0 0 15px;line-height:1.7}#engine-status button{color:#fff;background:#1c624d;border:0;border-radius:9px;min-height:44px;padding:8px 20px}@media (width<=600px){.engine-pad{grid-template-rows:repeat(3,44px);grid-template-columns:repeat(3,46px);gap:3px;bottom:10px;left:10px}.engine-pad-caption{display:none}.engine-tools{gap:5px;top:8px;right:8px}.engine-tools button{padding:6px 10px;font-size:12px}#engine-controls #engine-action{width:72px;height:62px;font-size:17px;bottom:20px;right:12px}}</style>

    <link rel="modulepreload" crossorigin href="/rpgjs/assets/rolldown-runtime-XKyaHtl9.js">
    <link rel="modulepreload" crossorigin href="/rpgjs/assets/canvasengine-DjHPjr3v.js">

  <body>
    <div id="rpg"><div id="vue-gui-overlay"></div></div>
    <p id="engine-task-hint" role="status" hidden></p>
    <div id="path-dots" hidden></div>
    <div id="focus-marker" hidden><span class="focus-ring" aria-hidden="true"></span><span class="focus-arrow" aria-hidden="true">↓</span><span id="focus-label">下一目标</span></div>
    <div id="engine-controls" aria-label="园区操作" hidden>
      <nav class="engine-tools" aria-label="探究帮助">
        <button id="engine-flow" type="button">查看流程</button>
        <button id="engine-help" type="button">操作帮助</button>
        <button id="engine-hint" type="button">求助</button>
        <button id="engine-goto" type="button">前往下一目标</button>
      </nav>
      <div class="engine-pad" aria-label="按住方向按钮行走">
        <button type="button" data-direction="up" aria-label="向上行走" aria-pressed="false">↑</button>
        <button type="button" data-direction="left" aria-label="向左行走" aria-pressed="false">←</button>
        <button type="button" data-direction="right" aria-label="向右行走" aria-pressed="false">→</button>
        <button type="button" data-direction="down" aria-label="向下行走" aria-pressed="false">↓</button>
        <span class="engine-pad-caption">按住行走 · 面向人物或设备后交互</span>
      </div>
      <button id="engine-action" type="button">交互<small>E / 空格</small></button>
    </div>
    <aside id="engine-status" role="alert" hidden>
      <p id="engine-status-text"></p>
      <button id="engine-reload" type="button" hidden>重新加载园区</button>
      <button id="engine-dismiss" type="button">返回现场</button>
    </aside>
  </body>
</html>
