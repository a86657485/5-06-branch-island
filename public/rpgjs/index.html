    <style>*{box-sizing:border-box}html,body,#rpg{width:100%;height:100%;margin:0;overflow:hidden}body{background:#173b31;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}#rpg{cursor:pointer;position:relative}#rpg canvas{display:block}#vue-gui-overlay{pointer-events:none;z-index:100;position:absolute;inset:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline-offset:3px;outline:3px solid #ffc968}[hidden]{display:none!important}#engine-controls{pointer-events:none;z-index:50;position:absolute;inset:0}#engine-controls button{pointer-events:auto;color:#193d32;touch-action:none;-webkit-user-select:none;user-select:none;background:#fff9ecf2;border:2px solid #dce8ce;border-radius:12px;min-height:46px;font-weight:750;box-shadow:0 3px #173b3160}.engine-tools{top:max(12px, env(safe-area-inset-top));right:max(12px, env(safe-area-inset-right));gap:8px;display:flex;position:absolute}.engine-tools button{padding:8px 14px;font-size:13px}#engine-quick-step{color:#fff!important;background:linear-gradient(135deg,#f59e0b,#d97706)!important;border-color:#fffaf0!important}.engine-pad{bottom:max(16px, env(safe-area-inset-bottom));left:max(16px, env(safe-area-inset-left));grid-template-rows:repeat(3,46px);grid-template-columns:repeat(3,50px);gap:5px;display:grid;position:absolute}.engine-pad button{padding:0;font-size:24px}.engine-pad button[aria-pressed=true]{box-shadow:none;background:#d0e7c7;transform:translateY(2px)}.engine-pad [data-direction=up]{grid-area:1/2}.engine-pad [data-direction=left]{grid-area:2/1}.engine-pad [data-direction=right]{grid-area:2/3}.engine-pad [data-direction=down]{grid-area:3/2}#engine-controls #engine-action{bottom:max(24px, env(safe-area-inset-bottom));right:max(20px, env(safe-area-inset-right));color:#fff;background:#1c624d;width:190px;height:70px;font-size:19px;position:absolute}#engine-action small{margin-top:4px;font-size:13px;font-weight:500;display:block}.engine-pad-caption{color:#fff;text-shadow:0 1px 3px #0e302d;white-space:nowrap;font-size:11px;position:absolute;bottom:0;left:175px}#engine-task-hint{color:#173b31;z-index:82;pointer-events:auto;cursor:pointer;background:#fffaf0f8;border:3px solid #f59e0b;border-radius:999px;max-width:min(580px,100% - 215px);margin:0;padding:10px 16px;font-size:17px;line-height:1.45;position:absolute;top:10px;left:14px;box-shadow:0 6px 18px #0f29224d}#engine-task-hint:before{content:"👆 点此或点地图目标直达：";color:#b45309;font-weight:800}#focus-marker{z-index:80;pointer-events:auto;cursor:pointer;color:#173b31;width:0;height:0;font-weight:800;position:absolute;top:0;left:0}#focus-marker .focus-ring{width:var(--ring-width,88px);height:var(--ring-height,28px);pointer-events:auto;background:0 0;border:3px solid #fbbf24;border-radius:50%;animation:1.2s ease-in-out infinite focus-feet-pulse;position:absolute;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #f59e0b40}#focus-marker .focus-arrow{right:calc(var(--target-half-width,27px) + 12px);color:#f59e0b;filter:drop-shadow(0 2px 3px #173b31);pointer-events:none;width:28px;font-size:32px;line-height:1;animation:1.2s ease-in-out infinite focus-side-nudge;position:absolute;top:-46px}#focus-label{white-space:nowrap;color:#183c30;background:#fffbeb;border:2px solid #f59e0b;border-radius:999px;padding:5px 12px;font-size:14px;position:absolute;top:-88px;left:0;transform:translate(-50%);box-shadow:0 4px 12px #0f292244}#focus-label:empty,#focus-marker.edge .focus-ring{display:none}#focus-marker.edge .focus-arrow{width:auto;font-size:42px;animation:none;top:0;left:0;right:auto;transform:translate(-50%,-50%)}#path-dots{z-index:70;pointer-events:none;position:fixed;inset:0}.path-dot{background:#e39b00;border:3px solid #173b31;border-radius:50%;width:16px;height:16px;margin:-8px 0 0 -8px;position:absolute;box-shadow:0 0 0 3px #fff6}#engine-goto.focus-target{outline:4px solid #ffcf5a;animation:1s ease-in-out infinite focus-pulse}.card-tray.focus-target,.flow-slot.foc lc(100% - 300px);padding:10px 14px;font-size:17px;line-height:1.5;position:absolute;bottom:22px;left:16px}#engine-assistance{color:#173b31;z-index:90;background:#fff3cffa;border:2px solid #ba8b28;border-radius:14px;max-width:min(560px,100% - 32px);padding:14px 46px 14px 16px;font-size:17px;line-height:1.5;position:absolute;bottom:90px;left:16px}#engine-assistance p{white-space:pre-line;margin:6px 0 0}#engine-assistance-close{color:#173b31;background:#f2dfab;border:0;border-radius:50%;width:32px;height:32px;font-size:25px;position:absolute;top:6px;right:8px}#focus-marker.assisted-marker .focus-ring{border-color:#ba8b28;box-shadow:0 0 0 5px #fbbf2440}@media (width<=600px){#engine-feedback{max-width:calc(100% - 20px);font-size:15px;bottom:78px;left:10px}#engine-assistance{font-size:15px;bottom:130px;left:10px}.engine-tools{flex-wrap:wrap;justify-content:flex-end;max-width:100%}}</style>
    <style id="lesson-touch-ui">#lesson-joystick{left:max(14px, env(safe-area-inset-left));bottom:max(16px, env(safe-area-inset-bottom));z-index:60;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;background:#fffaf0b8;border:3px solid #184c3b8c;border-radius:50%;width:132px;height:132px;display:none;position:absolute;box-shadow:0 4px 14px #102e2c40}#lesson-joystick.is-active{background:#fffaf0e6;border-color:#184c3b}#lesson-joystick:after{content:"";border:2px dashed #184c3b33;border-radius:50%;position:absolute;inset:14px}#lesson-joystick-knob{pointer-events:none;background:#1c624d;border:3px solid #fffaf0;border-radius:50%;width:58px;height:58px;margin:-29px 0 0 -29px;position:absolute;top:50%;left:50%;box-shadow:0 2px 6px #0000004d}#lesson-joystick-label{text-align:center;color:#fff;text-shadow:0 1px 3px #0e302d;pointer-events:none;font-size:12px;font-weight:700;position:absolute;top:-24px;left:0;right:0}@media (pointer:coarse){#lesson-joystick{display:block}}html.lesson-touch #lesson-joystick{display:block}@media (pointer:coarse){#engine-feedback{max-width:none;bottom:160px;left:14px;right:14px}#engine-assistance{max-width:calc(100% - 28px);bottom:170px;left:14px}}html.lesson-touch #engine-feedback{max-width:none;bottom:160px;left:14px;right:14px}html.lesson-touch #engine-assistance{max-width:calc(100% - 28px);bottom:170px;left:14px}@media (width<=600px){#lesson-joystick{width:118px;height:118px;bottom:12px;left:10px}#lesson-joystick-knob{width:52px;height:52px;margin:-26px 0 0 -26px}}#engine-task-hint{font-size:19px!important;font-weight:750!important;line-height:1.55!important}.dialog-text{font-size:clamp(18px,2.05vw,23px)!important;font-weight:600!important}.dialog-program{background:#eef6e5!important;border:2px solid #7ba06f!important;font-size:19px!important;font-weight:700!important}.dialog-program p{margin:8px 0!important}.dialog-hint{font-size:17px!important;font-weight:600!important}.dialog-choices button{font-size:18px!im     <link rel="modulepreload" crossorigin href="/rpgjs/assets/rolldown-runtime-XKyaHtl9.js">

  <body>
    <div id="rpg"><div id="vue-gui-overlay"></div></div>
    <p id="engine-task-hint" role="status" hidden></p>
    <p id="engine-feedback" role="status" hidden></p>
    <aside id="engine-assistance" role="status" hidden><button id="engine-assistance-close" type="button" aria-label="关闭帮助提示">×</button><strong>探究帮助</strong><p></p></aside>
    <div id="path-dots" hidden></div>
    <div id="focus-marker" hidden><span class="focus-ring" aria-hidden="true"></span><span class="focus-arrow" aria-hidden="true">→</span><span id="focus-label">下一目标</span></div>
    <div id="engine-controls" aria-label="园区操作" hidden>
      <nav class="engine-tools" aria-label="探究帮助">
        <button id="engine-quick-step" type="button" title="免折返跑：一键推进当前现场实验">⚡ 现场快测</button>
        <button id="engine-learn" type="button">巡检手册</button>
        <button id="engine-flow" type="button">查看流程</button>
        <button id="engine-help" type="button">操作帮助</button>
        <button id="engine-undo" type="button" disabled>↶ 撤回上一步</button>
        <button id="engine-hint" type="button">通关法宝 5/5</button>
        <button id="engine-goto" type="button">自动前往任务点</button>
      </nav>
      <button id="engine-action" type="button" aria-describedby="engine-action-help" disabled><span id="engine-action-label">交谈 / 操作</span><small id="engine-action-help">请先靠近目标</small></button>
      <div id="lesson-joystick" role="group" aria-label="移动摇杆：按住并拖动可让巡检员走动">
        <div id="lesson-joystick-knob" aria-hidden="true"></div>
        <span id="lesson-joystick-label" aria-hidden="true">按住拖动</span>
      </div>
    </div>
    <aside id="engine-status" role="alert" hidden>
      <p id="engine-status-text"></p>
      <button id="engine-reload" type="button" hidden>重新加载园区</button>
      <button id="engine-dismiss" type="button">返回现场</button>
    </aside>
    <script src="/rpgjs/joystick.js"></script>
  </body>
</html>
