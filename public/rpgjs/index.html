    <style>*{box-sizing:border-box}html,body,#rpg{width:100%;height:100%;margin:0;overflow:hidden}body{background:#173b31;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}#rpg{position:relative}#rpg canvas{display:block}#vue-gui-overlay{pointer-events:none;z-index:100;position:absolute;inset:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline-offset:3px;outline:3px solid #ffc968}[hidden]{display:none!important}#engine-controls{pointer-events:none;z-index:50;position:absolute;inset:0}#engine-controls button{pointer-events:auto;color:#193d32;touch-action:none;-webkit-user-select:none;user-select:none;background:#fff9ecf2;border:2px solid #dce8ce;border-radius:12px;min-height:46px;font-weight:750;box-shadow:0 3px #173b3160}.engine-tools{top:max(12px, env(safe-area-inset-top));right:max(12px, env(safe-area-inset-right));gap:8px;display:flex;position:absolute}.engine-tools button{padding:8px 14px;font-size:13px}.engine-pad{bottom:max(16px, env(safe-area-inset-bottom));left:max(16px, env(safe-area-inset-left));grid-template-rows:repeat(3,46px);grid-template-columns:repeat(3,50px);gap:5px;display:grid;position:absolute}.engine-pad button{padding:0;font-size:24px}.engine-pad button[aria-pressed=true]{box-shadow:none;background:#d0e7c7;transform:translateY(2px)}.engine-pad [data-direction=up]{grid-area:1/2}.engine-pad [data-direction=left]{grid-area:2/1}.engine-pad [data-direction=right]{grid-area:2/3}.engine-pad [data-direction=down]{grid-area:3/2}#engine-controls #engine-action{bottom:max(24px, env(safe-area-inset-bottom));right:max(20px, env(safe-area-inset-right));color:#fff;background:linear-gradient(135deg,#1c624d,#0f766e);border:3px solid #ffd166;width:225px;height:76px;font-size:20px;position:absolute;box-shadow:0 6px 20px #092b2a88}#engine-controls #engine-action:not(:disabled){background:linear-gradient(135deg,#be185d,#ff1493);border-color:#fff;animation:1s ease-in-out infinite focus-pulse;box-shadow:0 0 0 4px #ff149366,0 8px 24px #4a0028cc}#engine-action small{margin-top:4px;font-size:13px;font-weight:600;display:block}.engine-pad-caption{color:#fff;text-shadow:0 1px 3px #0e302d;white-space:nowrap;font-size:11px;position:absolute;bottom:0;left:175px}#station-step-bar{z-index:82;pointer-events:none;background:#071f18e8;border:2px solid #ffd166;border-radius:14px;flex-wrap:wrap;align-items:center;gap:5px;max-width:min(680px,100% - 440px);padding:6px 12px;display:flex;position:absolute;top:8px;left:14px;box-shadow:0 4px 14px #0006}#station-step-bar .step-pill{color:#cbd5e1;white-space:nowrap;background:#1e293b99;border:1.5px solid #475569;border-radius:999px;padding:3px 9px;font-size:13px;font-weight:800}#station-step-bar .step-pill.done{color:#dcfce7;background:#14532d;border-color:#22c55e}#station-step-bar .step-pill.active{color:#fff;background:#be185d;border-color:#ff80ab;font-size:14px;box-shadow:0 0 0 2px #ff149355}#station-step-bar .step-sep{color:#ffd166;font-size:13px;font-weight:900}#engine-task-hint{color:#173b31;z-index:82;pointer-events:none;background:#fffaf0f8;border:3px solid #ff1493;border-radius:999px;max-width:min(640px,100% - 215px);margin:0;padding:9px 16px;font-size:17px;line-height:1.45;position:absolute;top:52px;left:14px;box-shadow:0 6px 18px #4a002855}#engine-task-hint:before{content:"🕹️ 用摇杆或方向键前往：";color:#c2185b;font-weight:900}#guide-trail{z-index:68;pointer-events:none;position:fixed;inset:0}.trail-step{background:radial-gradient(circle,#fff 25%,#00e5ff 70%,#ff1493 100%);border:2.5px solid #fff;border-radius:50%;width:18px;height:18px;margin:-9px 0 0 -9px;animation:1s ease-in-out infinite trail-pulse;position:absolute;box-shadow:0 0 12px 3px #00e5ffaa,0 0 20px 4px #ff149388}@keyframes trail-pulse{0%,to{opacity:.78;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}#actor-badges{z-index:75;pointer-events:none;position:fixed;inset:0}.actor-name-badge{pointer-events:auto;cursor:pointer;white-space:nowrap;color:#fff;letter-spacing:.03em;text-shadow:0 1px 3px #000;background:#071f18fa;border:3px solid #ffd166;border-radius:999px;padding:5px 15px;font-size:19px;font-weight:900;transition:transform .12s,border-color .12s;position:absolute;transform:translate(-50%,-105%);box-shadow:0 5px 14px #0009}.actor-name-badge.is-focus{color:#fff;background:linear-gradient(135deg,#880e4f,#be185d);border:3.5px solid #fff;font-size:20px;animation:1.1s ease-in-out infinite badge-nudge;box-shadow:0 0 0 4px #ff149388,0 8px 22px #4a0028cc}@keyframes badge-nudge{0%,to{transform:translate(-50%,-105%)scale(1)}50%{transform:translate(-50%,-114%)scale(1.05)}}#focus-marker{z-index:80;pointer-events:none;color:#fff;width:0;height:0;font-weight:900;position:absolute;top:0;left:0}#focus-marker .focus-ring{width:var(--ring-width,92px);height:var(--ring-height,32px);pointer-events:none;background:0 0;border:4px solid #ff1493;border-radius:50%;outline:3px solid #fff;animation:1.1s ease-in-out infinite focus-feet-pulse;position:absolute;transform:translate(-50%,-50%);box-shadow:0 0 0 6px #ff149366,0 0 22px 4px #ff007f}#focus-marker .focus-arrow{right:calc(var(--target-half-width,27px) + 14px);color:#ff1493;filter:drop-shadow(0 0 3px #fff)drop-shadow(0 2px 5px #4a0028);pointer-events:none;width:30px;font-size:34px;line-height:1;animation:1.1s ease-in-out infinite focus-side-nudge;position:absolute;top:-46px}#focus-label{white-space:nowrap;color:#fff;background:#880e4f;border:2.5px solid #ff80ab;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:900;position:absolute;top:24px;left:0;transform:translate(-50%);box-shadow:0 4px 12px #4a002888}#focus-label:empty,#focus-marker.edge .focus-ring{display:none}#focus-marker.edge .focus-arrow{width:auto;font-size:42px;animation:none;top:0;left:0;right:auto;transform:translate(-50%,-50%)}#path-dots{z-index:70;pointer-events:none;position:fixed;inset:0}.path-dot{background:#ff1493;border:3px solid #fff;border-radius:50%;width:16px;height:16px;margin:-8px 0 0 -8px;position:absolute;box-shadow:0 0 0 3px #ff149366}#engine-goto.focus-target{outline:4px solid #ff1493;animation:1s ease-in-out infinite focus-pulse}.card-tray.focus-target,.flow-slot.focus-target,.studio.focus-target,.studio-tabs button.focus-target{outline-offset:4px;outline:4px solid #e39b00}.predict-table.focus-target{outline-offset:4px;outline:3px solid #1175bb}@keyframes focus-pulse{50%{border-color:#fff;outline-color:#00e5ff}}@keyframes focus-feet-pulse{0%,to{opacity:.88;transform:translate(-50%,-50%)scale(1)}50%{opacity:1;transform:translate(-50%,-50%)scale(1.16)}}@keyframes focus-side-nudge{50%{transform:translate(5px)}}@media (prefers-reduced-motion:reduce){#focus-marker .focus-ring,#focus-marker .focus-arrow,#engine-task-hint,#engine-goto.focus-target,.actor-name-badge.is-focus,.trail-step{animation:none}#focus-marker .focus-ring{opacity:.9}}@media (width<=820px){#station-step-bar{max-width:calc(100% - 20px);top:52px;left:10px}#engine-task-hint{max-width:calc(100% - 20px);padding:7px 10px;font-size:14px;top:98px;left:10px}.actor-name-badge{padding:3px 9px;font-size:14px}}#engine-status{color:#19392d;text-align:center;z-index:1200;background:#fff9e9;border:3px solid #d6bd79;border-radius:18px;padding:22px;position:absolute;inset:22% 8% auto;box-shadow:0 15px 45px #092b2a66}#engine-status p{margin:0 0 15px;line-height:1.7}#engine-status button{color:#fff;background:#1c624d;border:0;border-radius:9px;min-height:44px;padding:8px 20px}@media (width<=600px){.engine-pad{grid-template-rows:repeat(3,44px);grid-template-columns:repeat(3,46px);gap:3px;bottom:10px;left:10px}.engine-pad-caption{display:none}.engine-tools{gap:5px;top:8px;right:8px}.engine-tools button{padding:6px 10px;font-size:12px}#engine-controls #engine-action{width:195px;height:68px;font-size:17px;bottom:20px;right:12px}}#engine-goto{display:none!important}#engine-goto:disabled,#engine-action:disabled{opacity:.65;cursor:default}#engine-status p{white-space:pre-line}#engine-feedback{color:#fff;z-index:85;pointer-events:none;background:#071f18f2;border:2.5px solid #ffd166;border-radius:14px;max-width:calc(100% - 440px);padding:10px 16px;font-size:17px;font-weight:750;line-height:1.5;position:absolute;bottom:24px;left:164px;box-shadow:0 6px 18px #0006}#engine-assistance{color:#173b31;z-index:90;background:#fff3cffa;border:2px solid #ba8b28;border-radius:14px;max-width:min(560px,100% - 340px);padding:14px 46px 14px 16px;font-size:17px;line-height:1.5;position:absolute;bottom:92px;left:164px}#engine-assistance p{white-space:pre-line;margin:6px 0 0}#engine-assistance-close{color:#173b31;background:#f2dfab;border:0;border-radius:50%;width:32px;height:32px;font-size:25px;position:absolute;top:6px;right:8px}#focus-marker.assisted-marker .focus-ring{border-color:#00e5ff;box-shadow:0 0 0 6px #00e5ff66,0 0 22px 4px #00e5ff}@media (width<=600px){#engine-feedback{max-width:calc(100% - 20px);font-size:15px;bottom:156px;left:10px}#engine-assistance{max-width:calc(100% - 20px);font-size:15px;bottom:205px;left:10px}.engine-tools{flex-wrap:wrap;justify-content:flex-end;max-width:100%}}</style>
    <style id="lesson-touch-ui">#lesson-joystick{left:max(16px, env(safe-area-inset-left));bottom:max(18px, env(safe-area-inset-bottom));z-index:60;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;background:#fffaf0d9;border:3.5px solid #184c3b;border-radius:50%;width:132px;height:132px;display:block;position:absolute;box-shadow:0 6px 18px #102e2c66}#lesson-joystick.is-active{cursor:grabbing;background:#fffaf0f8;border-color:#ff1493}#lesson-joystick:after{content:"";border:2px dashed #184c3b4d;border-radius:50%;position:absolute;inset:14px}#lesson-joystick-knob{pointer-events:none;background:linear-gradient(135deg,#1c624d,#0f3d2e);border:3px solid #fffaf0;border-radius:50%;width:58px;height:58px;margin:-29px 0 0 -29px;position:absolute;top:50%;left:50%;box-shadow:0 3px 8px #0006}#lesson-joystick-label{text-align:center;color:#fff;pointer-events:none;white-space:nowrap;background:#0b241dd9;border:1.5px solid #ffd166;border-radius:999px;padding:2px 6px;font-size:12px;font-weight:900;position:absolute;top:-28px;left:-14px;right:-14px}@media (width<=600px){#lesson-joystick{width:118px;height:118px;bottom:12px;left:10px}#lesson-joystick-knob{width:52px;height:52px;margin:-26px 0 0 -26px}}#engine-task-hint{font-size:18px!important;font-weight:800!important;line-height:1.5!important}.dialog-text{font-size:clamp(18px,2.05vw,23px)!important;font-weight:600!important}.dialog-program{background:#eef6e5!important;border:2px solid #7ba06f!important;font-size:19px!important;font-weight:700!important}.dialog-program p{margin:8px 0!important}.dialog-hint{font-size:17px!important;font-weight:600!important}.dialog-choices button{font-size:18px!important;font-weight:700!important}.studio{font-size:17px!important}.studio-kicker{font-size:19px!important}.studio-order{font-size:15px!important;font-weight:650!important}.studio-card,.flow-slot,.sentence-slot{font-size:17px!important;font-weight:700!important}.predict-table{font-size:17px!important   <body>
    <div id="rpg"><div id="vue-gui-overlay"></div></div>
    <div id="station-step-bar" role="navigation" aria-label="当前站点四步进度" hidden></div>
    <p id="engine-task-hint" role="status" hidden></p>
    <p id="engine-feedback" role="status" hidden></p>
    <aside id="engine-assistance" role="status" hidden><button id="engine-assistance-close" type="button" aria-label="关闭帮助提示">×</button><strong>探究帮助</strong><p></p></aside>
    <div id="guide-trail" hidden></div>
    <div id="path-dots" hidden></div>
    <div id="actor-badges" hidden></div>
    <div id="focus-marker" hidden><span class="focus-ring" aria-hidden="true"></span><span class="focus-arrow" aria-hidden="true">→</span><span id="focus-label">下一目标</span></div>
    <div id="engine-controls" aria-label="园区操作" hidden>
      <nav class="engine-tools" aria-label="探究帮助">
        <button id="engine-learn" type="button">📖 巡检手册</button>
        <button id="engine-flow" type="button">📊 查看流程</button>
        <button id="engine-help" type="button">❓ 操作帮助</button>
        <button id="engine-undo" type="button" disabled>↶ 撤回上一步</button>
        <button id="engine-hint" type="button">✨ 通关法宝 5/5</button>
        <button id="engine-goto" type="button" hidden>自动前往任务点</button>
      </nav>
      <button id="engine-action" type="button" aria-describedby="engine-action-help" disabled><span id="engine-action-label">交谈 / 操作</span><small id="engine-action-help">请先靠近目标</small></button>
      <div id="lesson-joystick" role="group" aria-label="移动摇杆：按住并拖动可让巡检员走动">
        <div id="lesson-joystick-knob" aria-hidden="true"></div>
        <span id="lesson-joystick-label" aria-hidden="true">拖动摇杆 / 按方向键移动</span>
      </div>
    </div>
    <aside id="engine-status" role="alert" hidden>
      <p id="engine-status-text"></p>
      <button id="engine-reload" type="button" hidden>重新加载园区</button>
      <button id="engine-dismiss" type="button">返回现场</button>
    </aside>
    <script src="/rpgjs/joystick.js"></script>
  </body>
</html>
