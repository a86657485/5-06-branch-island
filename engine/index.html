<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>智慧园区 · 判断选择用分支</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #rpg { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #173b31; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #rpg { position: relative; cursor: pointer; }
      #rpg canvas { display: block; }
      #vue-gui-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
      button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 3px solid #ffc968; outline-offset: 3px; }
      [hidden] { display: none !important; }
      #engine-controls { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
      #engine-controls button { pointer-events: auto; min-height: 46px; border: 2px solid #dce8ce; border-radius: 12px; background: #fff9ecf2; color: #193d32; box-shadow: 0 3px 0 #173b3160; font-weight: 750; touch-action: none; user-select: none; -webkit-user-select: none; }
      .engine-tools { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; }
      .engine-tools button { padding: 8px 14px; font-size: 13px; }
      .engine-pad { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 46px); gap: 5px; }
      .engine-pad button { padding: 0; font-size: 24px; }
      .engine-pad button[aria-pressed=true] { background: #d0e7c7; transform: translateY(2px); box-shadow: none; }
      .engine-pad [data-direction=up] { grid-column: 2; grid-row: 1; }
      .engine-pad [data-direction=left] { grid-column: 1; grid-row: 2; }
      .engine-pad [data-direction=right] { grid-column: 3; grid-row: 2; }
      .engine-pad [data-direction=down] { grid-column: 2; grid-row: 3; }
      #engine-controls #engine-action { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); width: 190px; height: 70px; background: #1c624d; color: white; font-size: 19px; }
      #engine-action small { display: block; font-size: 13px; margin-top: 4px; font-weight: 500; }
      .engine-pad-caption { position: absolute; bottom: 0; left: 175px; color: white; text-shadow: 0 1px 3px #0e302d; font-size: 11px; white-space: nowrap; }
      #station-step-bar { position: absolute; left: 14px; top: 8px; max-width: min(680px, calc(100% - 440px)); display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 14px; background: #071f18e8; border: 2px solid #ffd166; z-index: 82; pointer-events: auto; cursor: pointer; box-shadow: 0 4px 14px #00000066; }
      #station-step-bar .step-pill { padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #cbd5e1; background: #1e293b99; border: 1.5px solid #475569; white-space: nowrap; }
      #station-step-bar .step-pill.done { color: #dcfce7; background: #14532d; border-color: #22c55e; }
      #station-step-bar .step-pill.active { color: #ffffff; background: #be185d; border-color: #ff80ab; box-shadow: 0 0 0 2px #ff149355; font-size: 14px; }
      #station-step-bar .step-sep { color: #ffd166; font-weight: 900; font-size: 13px; }
      #engine-task-hint { position:absolute;left:14px;top:52px;max-width:min(640px,calc(100% - 215px));padding:9px 16px;margin:0;border:3px solid #ff1493;border-radius:999px;background:#fffaf0f8;color:#173b31;z-index:82;font-size:17px;line-height:1.45;pointer-events:auto;cursor:pointer;box-shadow:0 6px 18px #4a002855;}
      #engine-task-hint::before { content:"💬 当前任务引导（点此直达）："; font-weight:900; color:#c2185b; }
      #guide-trail { position: fixed; inset: 0; z-index: 68; pointer-events: none; }
      .trail-step { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: radial-gradient(circle, #ffffff 25%, #00e5ff 70%, #ff1493 100%); border: 2.5px solid #ffffff; box-shadow: 0 0 12px 3px #00e5ffaa, 0 0 20px 4px #ff149388; animation: trail-pulse 1s ease-in-out infinite; }
      @keyframes trail-pulse { 0%, 100% { transform: scale(0.85); opacity: 0.78; } 50% { transform: scale(1.2); opacity: 1; } }
      #actor-badges { position: fixed; inset: 0; z-index: 75; pointer-events: none; }
      .actor-name-badge { position: absolute; transform: translate(-50%, -105%); pointer-events: auto; cursor: pointer; white-space: nowrap; padding: 5px 15px; border-radius: 999px; background: #071f18fa; border: 3px solid #ffd166; color: #ffffff; font-size: 19px; font-weight: 900; letter-spacing: 0.03em; box-shadow: 0 5px 14px #00000099; text-shadow: 0 1px 3px #000000; transition: transform 0.12s ease, border-color 0.12s ease; }
      .actor-name-badge:hover { transform: translate(-50%, -110%) scale(1.05); border-color: #00e5ff; }
      .actor-name-badge.is-focus { background: linear-gradient(135deg, #880e4f, #be185d); border: 3.5px solid #ffffff; color: #ffffff; font-size: 20px; box-shadow: 0 0 0 4px #ff149388, 0 8px 22px #4a0028cc; animation: badge-nudge 1.1s ease-in-out infinite; }
      @keyframes badge-nudge { 0%, 100% { transform: translate(-50%, -105%) scale(1); } 50% { transform: translate(-50%, -114%) scale(1.05); } }
      #focus-marker { position:absolute; left:0; top:0; width:0; height:0; z-index:80; pointer-events:auto; cursor:pointer; color:#ffffff; font-weight:900; }
      #focus-marker .focus-ring { position:absolute; width:var(--ring-width,92px); height:var(--ring-height,32px); border:4px solid #ff1493; border-radius:50%; background:transparent; outline:3px solid #ffffff; box-shadow:0 0 0 6px #ff149366, 0 0 22px 4px #ff007f; pointer-events:auto; transform:translate(-50%,-50%); animation:focus-feet-pulse 1.1s ease-in-out infinite; }
      #focus-marker .focus-arrow { position:absolute; right:calc(var(--target-half-width,27px) + 14px); top:-46px; width:30px; font-size:34px; line-height:1; color:#ff1493; filter:drop-shadow(0 0 3px #ffffff) drop-shadow(0 2px 5px #4a0028); pointer-events:none; animation:focus-side-nudge 1.1s ease-in-out infinite; }
      #focus-label { position:absolute; top:24px; left:0; transform:translateX(-50%); white-space:nowrap; padding:4px 12px; border-radius:999px; background:#880e4f; border:2.5px solid #ff80ab; color:#ffffff; font-size:15px; font-weight:900; box-shadow:0 4px 12px #4a002888; }
      #focus-label:empty { display:none; }
      #focus-marker.edge .focus-ring { display:none; }
      #focus-marker.edge .focus-arrow { right:auto; left:0; top:0; width:auto; font-size:42px; transform:translate(-50%,-50%); animation:none; }
      #path-dots { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
      .path-dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #ff1493; border: 3px solid #ffffff; box-shadow: 0 0 0 3px #ff149366; }
      #engine-goto.focus-target { outline:4px solid #ff1493; animation:focus-pulse 1s ease-in-out infinite; }
      .card-tray.focus-target, .flow-slot.focus-target, .studio.focus-target, .studio-tabs button.focus-target { outline: 4px solid #e39b00; outline-offset: 4px; }
      .predict-table.focus-target { outline: 3px solid #1175bb; outline-offset: 4px; }
      @keyframes focus-pulse { 50% { outline-color:#00e5ff; border-color:#fff; } }
      @keyframes focus-feet-pulse { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:.88; } 50% { transform:translate(-50%,-50%) scale(1.16); opacity:1; } }
      @keyframes focus-side-nudge { 50% { transform:translateX(5px); } }
      @media(prefers-reduced-motion:reduce){#focus-marker .focus-ring,#focus-marker .focus-arrow,#engine-task-hint,#engine-goto.focus-target,.actor-name-badge.is-focus,.trail-step{animation:none;}#focus-marker .focus-ring{opacity:.9;}}
      @media(max-width:820px){#station-step-bar{max-width:calc(100% - 20px);top:52px;left:10px;}#engine-task-hint{max-width:calc(100% - 20px);top:98px;left:10px;font-size:14px;padding:7px 10px;}.actor-name-badge{font-size:14px;padding:3px 9px;}}
      #engine-status { position: absolute; inset: 22% 8% auto; padding: 22px; background: #fff9e9; color: #19392d; border: 3px solid #d6bd79; box-shadow: 0 15px 45px #092b2a66; border-radius: 18px; text-align: center; z-index: 1200; }
      #engine-status p { margin: 0 0 15px; line-height: 1.7; }
      #engine-status button { min-height: 44px; padding: 8px 20px; border: 0; border-radius: 9px; color: white; background: #1c624d; }
      @media (max-width: 600px) { .engine-pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 44px); gap: 3px; left: 10px; bottom: 10px; } .engine-pad-caption { display: none; } .engine-tools { top: 8px; right: 8px; gap: 5px; } .engine-tools button { font-size: 12px; padding: 6px 10px; } #engine-controls #engine-action { right: 12px; bottom: 20px; width: 180px; height: 68px; font-size: 17px; } }
    #engine-goto { position:fixed;right:20px;bottom:108px;min-width:255px;min-height:58px;background:linear-gradient(135deg,#be185d,#ff1493)!important;color:white!important;border:3px solid #ffffff!important;font-size:18px!important;box-shadow:0 6px 20px #4a002888;} #engine-goto:disabled, #engine-action:disabled {opacity:.65;cursor:default;} #engine-status p {white-space:pre-line;} @media(max-width:600px){#engine-goto{right:12px;bottom:102px;min-width:205px;font-size:15px!important;}}
    #engine-feedback{position:absolute;left:164px;bottom:24px;max-width:calc(100% - 440px);padding:10px 16px;border-radius:14px;border:2.5px solid #ffd166;background:#071f18f2;color:#ffffff;font-weight:750;font-size:17px;line-height:1.5;z-index:85;pointer-events:none;box-shadow:0 6px 18px #00000066;}
#engine-assistance{position:absolute;left:164px;bottom:92px;max-width:min(560px,calc(100% - 340px));padding:14px 46px 14px 16px;border:2px solid #ba8b28;border-radius:14px;background:#fff3cffa;color:#173b31;font-size:17px;line-height:1.5;z-index:90;}
#engine-assistance p{white-space:pre-line;margin:6px 0 0;}#engine-assistance-close{position:absolute;top:6px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:#f2dfab;color:#173b31;font-size:25px;}
#focus-marker.assisted-marker .focus-ring{border-color:#00e5ff;box-shadow:0 0 0 6px #00e5ff66, 0 0 22px 4px #00e5ff;}
@media(max-width:600px){#engine-feedback{bottom:156px;left:10px;max-width:calc(100% - 20px);font-size:15px;}#engine-assistance{left:10px;bottom:205px;max-width:calc(100% - 20px);font-size:15px;}.engine-tools{flex-wrap:wrap;justify-content:flex-end;max-width:100%;}}
</style>
    <style id="lesson-touch-ui">
      /* 电脑与平板常驻虚拟摇杆（2026-10-26）：支持鼠标按住拖动与触屏拖动 */
      #lesson-joystick{
        position:absolute;left:max(16px, env(safe-area-inset-left));bottom:max(18px, env(safe-area-inset-bottom));
        width:132px;height:132px;border-radius:50%;display:block;z-index:60;
        background:#fffaf0d9;border:3.5px solid #184c3b;box-shadow:0 6px 18px #102e2c66;
        pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;
      }
      #lesson-joystick.is-active{background:#fffaf0f8;border-color:#ff1493;cursor:grabbing}
      #lesson-joystick::after{
        content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed #184c3b4d;
      }
      #lesson-joystick-knob{
        position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
        background:linear-gradient(135deg, #1c624d, #0f3d2e);border:3px solid #fffaf0;box-shadow:0 3px 8px #00000066;pointer-events:none;
      }
      #lesson-joystick-label{
        position:absolute;left:-6px;right:-6px;top:-28px;text-align:center;font-size:13px;font-weight:900;
        color:#fff;background:#0b241dd9;padding:2px 6px;border-radius:999px;border:1.5px solid #ffd166;pointer-events:none;
      }
      @media (max-width:600px){
        #lesson-joystick{width:118px;height:118px;left:10px;bottom:12px}
        #lesson-joystick-knob{width:52px;height:52px;margin:-26px 0 0 -26px}
      }

      /* 规则文本放大与强调（2026-10-26）：打包样式带 scoped 属性，这里用 !important 覆盖 */
      #engine-task-hint{font-size:18px !important;font-weight:800 !important;line-height:1.5 !important}
      .dialog-text{font-size:clamp(18px,2.05vw,23px) !important;font-weight:600 !important}
      .dialog-program{font-size:19px !important;font-weight:700 !important;background:#eef6e5 !important;border:2px solid #7ba06f !important}
      .dialog-program p{margin:8px 0 !important}
      .dialog-hint{font-size:17px !important;font-weight:600 !important}
      .dialog-choices button{font-size:18px !important;font-weight:700 !important}
      .studio{font-size:17px !important}
      .studio-kicker{font-size:19px !important}
      .studio-order{font-size:15px !important;font-weight:650 !important}
      .studio-card,.flow-slot,.sentence-slot{font-size:17px !important;font-weight:700 !important}
      .predict-table{font-size:17px !important}

      /* 短屏/平板：控制柜关闭按钮固定在面板内，底部操作条常驻（沿用上一轮修复） */
      .studio{position:relative !important}
      .studio .studio-close{position:absolute !important;right:8px !important;top:8px !important;margin-left:0 !important}
      @media (max-height:760px){
        .studio .studio-actions{position:sticky !important;bottom:0 !important;z-index:2;background:#fffaf0;padding:6px 0 4px}
      }
    </style>
  </head>
  <body>
    <div id="rpg"><div id="vue-gui-overlay"></div></div>
    <div id="station-step-bar" role="navigation" aria-label="当前站点四步进度" hidden></div>
    <p id="engine-task-hint" role="status" hidden></p>
    <p id="engine-feedback" role="status" hidden></p>
    <aside id="engine-assistance" role="status" hidden><button id="engine-assistance-close" type="button" aria-label="关闭帮助提示">×</button><strong>探究帮助</strong><p></p></aside>
    <div id="guide-trail" hidden></div>
    <div id="path-dots" hidden></div>
    <div id="actor-badges" hidden></div>
    <div id="focus-marker" hidden><span class="focus-ring" aria-hidden="true"></span><span class="focus-arrow" aria-hidden="true">→</span><span id="focus-label">下一目标</span></div>
    <div id="engine-controls" aria-label="园区操作" hidden>
      <nav class="engine-tools" aria-label="探究帮助">
        <button id="engine-learn" type="button">📖 巡检手册</button>
        <button id="engine-flow" type="button">📊 查看流程</button>
        <button id="engine-help" type="button">❓ 操作帮助</button>
        <button id="engine-undo" type="button" disabled>↶ 撤回上一步</button>
        <button id="engine-hint" type="button">✨ 通关法宝 5/5</button>
        <button id="engine-goto" type="button">👉 点我自动走过去并操作</button>
      </nav>
      <button id="engine-action" type="button" aria-describedby="engine-action-help" disabled><span id="engine-action-label">交谈 / 操作</span><small id="engine-action-help">请先靠近目标</small></button>
      <div id="lesson-joystick" role="group" aria-label="移动摇杆：按住并拖动可让巡检员走动">
        <div id="lesson-joystick-knob" aria-hidden="true"></div>
        <span id="lesson-joystick-label" aria-hidden="true">拖动摇杆移动</span>
      </div>
    </div>
    <aside id="engine-status" role="alert" hidden>
      <p id="engine-status-text"></p>
      <button id="engine-reload" type="button" hidden>重新加载园区</button>
      <button id="engine-dismiss" type="button">返回现场</button>
    </aside>
    <script src="/rpgjs/joystick.js"></script>
  </body>
</html>
