<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>智慧园区 · 判断选择用分支</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #rpg { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #173b31; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #rpg { position: relative; }
      #rpg canvas { display: block; }
      #vue-gui-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
      button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 3px solid #ffc968; outline-offset: 3px; }
      [hidden] { display: none !important; }
      #engine-controls { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
      #engine-controls button { pointer-events: auto; min-height: 46px; border: 2px solid #dce8ce; border-radius: 12px; background: #fff9ecf2; color: #193d32; box-shadow: 0 3px 0 #173b3160; font-weight: 750; touch-action: none; user-select: none; -webkit-user-select: none; }
      .engine-tools { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; }
      .engine-tools button { padding: 8px 14px; font-size: 13px; }
      .engine-pad { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 46px); gap: 5px; }
      .engine-pad button { padding: 0; font-size: 24px; }
      .engine-pad button[aria-pressed=true] { background: #d0e7c7; transform: translateY(2px); box-shadow: none; }
      .engine-pad [data-direction=up] { grid-column: 2; grid-row: 1; }
      .engine-pad [data-direction=left] { grid-column: 1; grid-row: 2; }
      .engine-pad [data-direction=right] { grid-column: 3; grid-row: 2; }
      .engine-pad [data-direction=down] { grid-column: 2; grid-row: 3; }
      #engine-controls #engine-action { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); width: 190px; height: 70px; background: #1c624d; color: white; font-size: 19px; }
      #engine-action small { display: block; font-size: 13px; margin-top: 4px; font-weight: 500; }
      .engine-pad-caption { position: absolute; bottom: 0; left: 175px; color: white; text-shadow: 0 1px 3px #0e302d; font-size: 11px; white-space: nowrap; }
      #engine-task-hint { position:absolute;left:14px;top:10px;max-width:min(580px,calc(100% - 215px));padding:10px 14px;margin:0;border:2px solid #93ad7e;border-radius:12px;background:#fffaf0ef;color:#1b4434;z-index:80;font-size:16px;line-height:1.5;pointer-events:none;}
      #focus-marker { position:absolute; left:0; top:0; width:0; height:0; z-index:80; pointer-events:none; color:#173b31; font-weight:800; }
      #focus-marker .focus-ring { position:absolute; width:var(--ring-width,88px); height:var(--ring-height,28px); border:3px solid #fbbf24; border-radius:50%; background:transparent; box-shadow:0 0 0 3px #f59e0b30; pointer-events:none; transform:translate(-50%,-50%); animation:focus-feet-pulse 1.2s ease-in-out infinite; }
      #focus-marker .focus-arrow { position:absolute; right:calc(var(--target-half-width,27px) + 12px); top:-38px; width:26px; font-size:30px; line-height:1; color:#f59e0b; filter:drop-shadow(0 1px 2px #173b31); pointer-events:none; animation:focus-side-nudge 1.2s ease-in-out infinite; }
      #focus-label { position:absolute; top:28px; left:0; transform:translateX(-50%); white-space:nowrap; }
      #focus-marker.edge .focus-ring { display:none; }
      #focus-marker.edge .focus-arrow { right:auto; left:0; top:0; width:auto; font-size:42px; transform:translate(-50%,-50%); animation:none; }
      #path-dots { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
      .path-dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #e39b00; border: 3px solid #173b31; box-shadow: 0 0 0 3px #fff6; }
      #engine-goto.focus-target { outline:4px solid #ffcf5a; animation:focus-pulse 1s ease-in-out infinite; }
      .card-tray.focus-target, .flow-slot.focus-target, .studio.focus-target, .studio-tabs button.focus-target { outline: 4px solid #e39b00; outline-offset: 4px; }
      .predict-table.focus-target { outline: 3px solid #1175bb; outline-offset: 4px; }
      @keyframes focus-pulse { 50% { outline-color:#147d78; border-color:#fff; } }
      @keyframes focus-feet-pulse { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:.6; } 50% { transform:translate(-50%,-50%) scale(1.12); opacity:.85; } }
      @keyframes focus-side-nudge { 50% { transform:translateX(4px); } }
      @media(prefers-reduced-motion:reduce){#focus-marker .focus-ring,#focus-marker .focus-arrow,#engine-task-hint,#engine-goto.focus-target{animation:none;}#focus-marker .focus-ring{opacity:.75;}}
      @media(max-width:600px){#engine-task-hint{max-width:calc(100% - 20px);top:62px;left:10px;font-size:14px;padding:7px 10px;}}
      #engine-status { position: absolute; inset: 22% 8% auto; padding: 22px; background: #fff9e9; color: #19392d; border: 3px solid #d6bd79; box-shadow: 0 15px 45px #092b2a66; border-radius: 18px; text-align: center; z-index: 1200; }
      #engine-status p { margin: 0 0 15px; line-height: 1.7; }
      #engine-status button { min-height: 44px; padding: 8px 20px; border: 0; border-radius: 9px; color: white; background: #1c624d; }
      @media (max-width: 600px) { .engine-pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 44px); gap: 3px; left: 10px; bottom: 10px; } .engine-pad-caption { display: none; } .engine-tools { top: 8px; right: 8px; gap: 5px; } .engine-tools button { font-size: 12px; padding: 6px 10px; } #engine-controls #engine-action { right: 12px; bottom: 20px; width: 180px; height: 68px; font-size: 17px; } }
    #engine-goto { position:fixed;right:20px;bottom:108px;min-width:240px;min-height:56px;background:#1c624d!important;color:white!important;font-size:19px!important;box-shadow:0 4px 18px #153b3266;} #engine-goto:disabled, #engine-action:disabled {opacity:.65;cursor:default;} #engine-status p {white-space:pre-line;} @media(max-width:600px){#engine-goto{right:12px;bottom:102px;min-width:200px;font-size:16px!important;}}
    #engine-feedback{position:absolute;left:16px;bottom:22px;max-width:calc(100% - 300px);padding:10px 14px;border-radius:12px;background:#fffaf0f2;color:#173b31;font-size:17px;line-height:1.5;z-index:85;pointer-events:none;}
#engine-assistance{position:absolute;left:16px;bottom:90px;max-width:min(560px,calc(100% - 32px));padding:14px 46px 14px 16px;border:2px solid #ba8b28;border-radius:14px;background:#fff3cffa;color:#173b31;font-size:17px;line-height:1.5;z-index:90;}
#engine-assistance p{white-space:pre-line;margin:6px 0 0;}#engine-assistance-close{position:absolute;top:6px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:#f2dfab;color:#173b31;font-size:25px;}
#focus-marker.assisted-marker .focus-ring{border-color:#ba8b28;box-shadow:0 0 0 5px #fbbf2440;}
@media(max-width:600px){#engine-feedback{bottom:78px;left:10px;max-width:calc(100% - 20px);font-size:15px;}#engine-assistance{left:10px;bottom:130px;font-size:15px;}.engine-tools{flex-wrap:wrap;justify-content:flex-end;max-width:100%;}}
</style>
    <style id="lesson-touch-ui">
      /* 触屏摇杆（2026-10-26）：平板上给一个可持续按住的方向摇杆。
         只在粗指针（触屏）或带触摸点的设备显示，桌面端保持键盘操作。 */
      #lesson-joystick{
        position:absolute;left:max(14px, env(safe-area-inset-left));bottom:max(16px, env(safe-area-inset-bottom));
        width:132px;height:132px;border-radius:50%;display:none;z-index:60;
        background:#fffaf0b8;border:3px solid #184c3b8c;box-shadow:0 4px 14px #102e2c40;
        pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;
      }
      #lesson-joystick.is-active{background:#fffaf0e6;border-color:#184c3b}
      #lesson-joystick::after{
        content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed #184c3b33;
      }
      #lesson-joystick-knob{
        position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
        background:#1c624d;border:3px solid #fffaf0;box-shadow:0 2px 6px #0000004d;pointer-events:none;
      }
      #lesson-joystick-label{
        position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:12px;font-weight:700;
        color:#fff;text-shadow:0 1px 3px #0e302d;pointer-events:none;
      }
      @media (pointer:coarse){ #lesson-joystick{display:block} }
      html.lesson-touch #lesson-joystick{display:block}
      /* 摇杆占了左下角，把反馈条与帮助卡抬起来，避免叠字 */
      @media (pointer:coarse){
        #engine-feedback{left:14px;right:14px;bottom:160px;max-width:none}
        #engine-assistance{bottom:170px;left:14px;max-width:calc(100% - 28px)}
      }
      html.lesson-touch #engine-feedback{bottom:160px;left:14px;right:14px;max-width:none}
      html.lesson-touch #engine-assistance{bottom:170px;left:14px;max-width:calc(100% - 28px)}
      @media (max-width:600px){
        #lesson-joystick{width:118px;height:118px;left:10px;bottom:12px}
        #lesson-joystick-knob{width:52px;height:52px;margin:-26px 0 0 -26px}
      }

      /* 规则文本放大与强调（2026-10-26）：打包样式带 scoped 属性，这里用 !important 覆盖 */
      #engine-task-hint{font-size:19px !important;font-weight:750 !important;line-height:1.55 !important}
      .dialog-text{font-size:clamp(18px,2.05vw,23px) !important;font-weight:600 !important}
      .dialog-program{font-size:19px !important;font-weight:700 !important;background:#eef6e5 !important;border:2px solid #7ba06f !important}
      .dialog-program p{margin:8px 0 !important}
      .dialog-hint{font-size:17px !important;font-weight:600 !important}
      .dialog-choices button{font-size:18px !important;font-weight:700 !important}
      .studio{font-size:17px !important}
      .studio-kicker{font-size:19px !important}
      .studio-order{font-size:16px !important;font-weight:650 !important}
      .studio-card,.flow-slot,.sentence-slot{font-size:17px !important;font-weight:700 !important}
      .predict-table{font-size:17px !important}

      /* 短屏/平板：控制柜关闭按钮固定在面板内，底部操作条常驻（沿用上一轮修复） */
      .studio{position:relative !important}
      .studio .studio-close{position:absolute !important;right:8px !important;top:8px !important;margin-left:0 !important}
      @media (max-height:760px){
        .studio .studio-actions{position:sticky !important;bottom:0 !important;z-index:2;background:#fffaf0;padding:6px 0 4px}
      }
    </style>
  </head>
  <body>
    <div id="rpg"><div id="vue-gui-overlay"></div></div>
    <p id="engine-task-hint" role="status" hidden></p>
    <p id="engine-feedback" role="status" hidden></p>
    <aside id="engine-assistance" role="status" hidden><button id="engine-assistance-close" type="button" aria-label="关闭帮助提示">×</button><strong>探究帮助</strong><p></p></aside>
    <div id="path-dots" hidden></div>
    <div id="focus-marker" hidden><span class="focus-ring" aria-hidden="true"></span><span class="focus-arrow" aria-hidden="true">→</span><span id="focus-label">下一目标</span></div>
    <div id="engine-controls" aria-label="园区操作" hidden>
      <nav class="engine-tools" aria-label="探究帮助">
        <button id="engine-learn" type="button">巡检手册</button>
        <button id="engine-flow" type="button">查看流程</button>
        <button id="engine-help" type="button">操作帮助</button>
        <button id="engine-undo" type="button" disabled>↶ 撤回上一步</button>
        <button id="engine-hint" type="button">通关法宝 5/5</button>
        <button id="engine-goto" type="button">自动前往任务点</button>
      </nav>
      <button id="engine-action" type="button" aria-describedby="engine-action-help" disabled><span id="engine-action-label">交谈 / 操作</span><small id="engine-action-help">请先靠近目标</small></button>
      <div id="lesson-joystick" role="group" aria-label="移动摇杆：按住并拖动可让巡检员走动">
        <div id="lesson-joystick-knob" aria-hidden="true"></div>
        <span id="lesson-joystick-label" aria-hidden="true">按住拖动</span>
      </div>
    </div>
    <aside id="engine-status" role="alert" hidden>
      <p id="engine-status-text"></p>
      <button id="engine-reload" type="button" hidden>重新加载园区</button>
      <button id="engine-dismiss" type="button">返回现场</button>
    </aside>
    <script src="/rpgjs/joystick.js"></script>
  </body>
</html>
